name: Diagnostic - validate Pinot and DolphinScheduler repairs on Arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinot:
    uses: ./.github/workflows/test-pinot.yml

  dolphinscheduler:
    uses: ./.github/workflows/test-dolphinscheduler.yml

  verify:
    needs: [pinot, dolphinscheduler]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      PINOT_JOB: ${{ needs.pinot.result }}
      PINOT_STATUS: ${{ needs.pinot.outputs.run_status }}
      PINOT_PASSED: ${{ needs.pinot.outputs.tests_passed }}
      PINOT_FAILED: ${{ needs.pinot.outputs.tests_failed }}
      PINOT_REGRESSION: ${{ needs.pinot.outputs.regression_status }}
      DOLPHINSCHEDULER_JOB: ${{ needs.dolphinscheduler.result }}
      DOLPHINSCHEDULER_STATUS: ${{ needs.dolphinscheduler.outputs.run_status }}
      DOLPHINSCHEDULER_PASSED: ${{ needs.dolphinscheduler.outputs.tests_passed }}
      DOLPHINSCHEDULER_FAILED: ${{ needs.dolphinscheduler.outputs.tests_failed }}
      DOLPHINSCHEDULER_REGRESSION: ${{ needs.dolphinscheduler.outputs.regression_status }}
    steps:
      - name: Require six passed tests and no failures in both packages
        shell: bash
        run: |
          set -euo pipefail
          for package in PINOT DOLPHINSCHEDULER; do
            job="${package}_JOB"
            status="${package}_STATUS"
            passed="${package}_PASSED"
            failed="${package}_FAILED"
            regression="${package}_REGRESSION"
            printf '%s: job=%s status=%s passed=%s failed=%s regression=%s\n' \
              "$package" "${!job}" "${!status}" "${!passed}" "${!failed}" "${!regression}"
            test "${!job}" = success
            test "${!status}" = success
            test "${!passed}" = 6
            test "${!failed}" = 0
            test "${!regression}" = passed
          done
