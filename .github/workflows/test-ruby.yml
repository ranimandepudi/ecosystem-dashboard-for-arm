name: Diagnostic - validate BoringSSL clone recovery on Arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boringssl:
    uses: ./.github/workflows/test-boringssl.yml

  verify:
    needs: boringssl
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      JOB: ${{ needs.boringssl.result }}
      STATUS: ${{ needs.boringssl.outputs.run_status }}
      PASSED: ${{ needs.boringssl.outputs.tests_passed }}
      FAILED: ${{ needs.boringssl.outputs.tests_failed }}
      CORE_FAILED: ${{ needs.boringssl.outputs.core_failed }}
      VERSION: ${{ needs.boringssl.outputs.package_version }}
      REGRESSION: ${{ needs.boringssl.outputs.regression_status }}
      DECISION: ${{ needs.boringssl.outputs.regression_decision }}
    steps:
      - name: Require the actual baseline checks and unchanged regression policy
        shell: bash
        run: |
          set -euo pipefail
          printf 'BoringSSL job=%s status=%s passed=%s failed=%s core_failed=%s version=%s regression=%s decision=%s\n' \
            "$JOB" "$STATUS" "$PASSED" "$FAILED" "$CORE_FAILED" "$VERSION" "$REGRESSION" "$DECISION"
          test "$JOB" = success
          test "$STATUS" = success
          test "$PASSED" = 5
          test "$FAILED" = 0
          test "$CORE_FAILED" = 0
          test "$VERSION" = fips-20220613
          test "$REGRESSION" = skipped
          test "$DECISION" = no_newer_stable_available
