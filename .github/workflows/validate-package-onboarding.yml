name: Validate sandbox package onboarding on Arm64

on:
  push:
    branches:
      - validation/package-onboarding-20261027
    paths:
      - .github/workflows/**
      - .github/scripts/**
      - content/linux/opensource_packages/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-publication-evidence:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Read authoritative Sandbox Runtime publication metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          url = 'https://registry.npmjs.org/@anthropic-ai%2fsandbox-runtime'
          with urllib.request.urlopen(url, timeout=45) as response:
              raw = response.read(8_000_001)
          if len(raw) > 8_000_000:
              raise RuntimeError('Registry response exceeds evidence size limit')
          data = json.loads(raw)
          names = list(data.get('versions', {}))
          selected = {}
          for version in list(dict.fromkeys(names[:5] + ['0.0.38', '0.0.81'])):
              package = data.get('versions', {}).get(version, {})
              selected[version] = {key: package.get(key) for key in
                  ('name', 'version', 'engines', 'cpu', 'os', 'dependencies', 'dist', 'repository')}
          print(json.dumps({'source': url, 'response_sha256': hashlib.sha256(raw).hexdigest(),
              'name': data.get('name'), 'published': {version: data.get('time', {}).get(version)
              for version in selected}, 'created': data.get('time', {}).get('created'),
              'versions': selected}, indent=2))
          PY
  bubblewrap:
    uses: ./.github/workflows/test-bubblewrap.yml
  runner-capabilities:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Inspect native Arm sandbox prerequisites
        shell: bash
        run: |
          set -u
          uname -a
          test "$(uname -m)" = aarch64 || exit 1
          printf 'Host page size: '
          getconf PAGESIZE
          if test -c /dev/kvm; then
            ls -l /dev/kvm
          else
            echo '/dev/kvm is unavailable; guest-boot validation cannot be claimed.'
          fi
          docker version || true
          systemctl --user is-system-running || true
          sysctl kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns || true
          if unshare --user --map-root-user --mount true; then
            echo 'Unprivileged user/mount namespace probe passed.'
          else
            echo 'Unprivileged user/mount namespaces are restricted.'
          fi
          if sudo unshare --mount --pid --fork true; then
            echo 'Privileged mount/PID namespace probe passed.'
          else
            echo 'Privileged mount/PID namespaces are restricted.'
          fi
