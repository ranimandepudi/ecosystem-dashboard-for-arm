name: Sandbox dashboard validation

on:
  pull_request_target:
    branches:
      - sandbox/pip-e2e
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    name: Validate bounded pip sandbox
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Reject external candidate repositories
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          printf '%s\n' \
            'Sandbox onboarding accepts branches from this repository only.' >&2
          exit 1

      - name: Check out trusted protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check out candidate as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned trusted validation dependency
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          python3 -c \
            'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))'
          python3 -m venv "$RUNNER_TEMP/fixture-validator"
          "$RUNNER_TEMP/fixture-validator/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --no-index \
            --only-binary=:all: \
            --require-hashes \
            --requirement trusted/build_steps/requirements-validation.txt
          printf '%s\n' "$RUNNER_TEMP/fixture-validator/bin" >> "$GITHUB_PATH"

      - name: Verify protected base fixture and archived identity evidence
        working-directory: trusted
        run: |
          set -euo pipefail
          sha256sum --check --strict \
            .github/catalog-evidence/numpy/SHA256SUMS
          python3 build_steps/build_pip_sandbox_fixture.py --check
          python3 build_steps/validate_package_identity_catalog.py
          python3 build_steps/validate_pip_sandbox_candidate.py \
            --repository-root .
          python3 -m unittest -v \
            build_steps.tests.test_build_pip_sandbox_fixture \
            build_steps.tests.test_validate_pip_sandbox_candidate
          python3 .github/actions/publish-generated-data-pr/tests/test_batch_artifact_attestation.py
          python3 .github/actions/publish-generated-data-pr/tests/test_orchestration_contract.py

      - name: Validate candidate transition from trusted base code
        run: |
          set -euo pipefail
          python3 trusted/build_steps/validate_pip_sandbox_candidate.py \
            --base-root trusted \
            --candidate-root candidate
          python3 \
            trusted/build_steps/validate_package_identity_catalog.py \
            --repository-root candidate

      - name: Install checksum-verified Actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 120 \
            --max-filesize 16777216 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' \
            "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" |
            sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            trusted/.github/workflows/sandbox-dashboard-validation.yml
          "$RUNNER_TEMP/actionlint" \
            -shellcheck= \
            -pyflakes= \
            candidate/.github/workflows/*.yml

      - name: Install checksum-verified Hugo Extended
        uses: ./trusted/.github/actions/setup-hugo
        with:
          version: "0.130.0"
          amd64-archive-sha256: 9ac781d19ca65f1263695dd3f8c0e26e52fd42d67416a4ba78530f9f9508cc75
          arm64-archive-sha256: 025785b56d6217d2528ad8782680332851acae0d78cc9f86a27f8e03ec1afa3c

      - name: Build exact Hugo dashboard
        working-directory: candidate
        run: hugo --minify --config config.toml,config.cloudfront.toml
